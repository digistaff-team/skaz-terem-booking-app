name: Keep Supabase project alive

# Free-tier Supabase проекты автоматически ставятся на паузу после ~7 дней
# без активности (см. память "supabase-free-tier-pause"). Пингуем REST API
# каждые 3 дня, чтобы проект считался активным и не засыпал.

on:
  schedule:
    - cron: "0 6 */3 * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST endpoint
        run: |
          curl -sf -o /dev/null \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            "https://aveitrccxqbjfxysogiv.supabase.co/rest/v1/bookings?select=id&limit=1"
